      # 2026-10-04: the self-audit receipt rule's mode (shadow | act) was documented but never forwarded — an env-overrides
      # value never reached the container. Owner chose act (coding option A); staged on boxes A + C (SARA1004 / SARC1004).
      - SELF_AUDIT_RECEIPT_RULE_MODE=${SELF_AUDIT_RECEIPT_RULE_MODE:-}
      - DECISION_GATE_CHECKER_ROUTE_DISABLED=${DECISION_GATE_CHECKER_ROUTE_DISABLED:-}
      - DECISION_GATE_THRESHOLD_AUTO_ROUTE_DEEP_RESEARCH=${DECISION_GATE_THRESHOLD_AUTO_ROUTE_DEEP_RESEARCH:-}
      # Decision-gate readiness job (E1 in-process, 2026-09-25): the WORKER runs
      # the cron (`decision-gate-readiness`); the backend only reports these on
      # GET /admin/model-roles/decision-readiness. Same three vars on both so
      # the readout matches what the worker does.
      - DECISION_GATE_READINESS_JOB_DISABLED=${DECISION_GATE_READINESS_JOB_DISABLED:-}
      - DECISION_GATE_READINESS_INTERVAL_MIN=${DECISION_GATE_READINESS_INTERVAL_MIN:-}
      - DECISION_GATE_READINESS_WINDOW_DAYS=${DECISION_GATE_READINESS_WINDOW_DAYS:-}
      # Ticket 4d476b9a (2026-10-21): stall-vs-egress attribution on every failed decision leg + ONE same-leg retry
      # when an event-loop stall explains a timeout; stall-caused all_legs_failed rows never feed the streak alert.
      # =1 restores the pre-change leg loop, rows and streak. Same var on backend + worker (both run decide()).
      - DECISION_GATE_STALL_RECOVERY_DISABLED=${DECISION_GATE_STALL_RECOVERY_DISABLED:-}
      # backlog CT-9 (2026-09-28): the sampled-state corpus (ON by default in code) + the temps autofit opt-in —
      # compose forwards only LISTED vars, so the off switch / rates / opt-in must be here to reach the container.
      - DECISION_GATE_STATE_SAMPLE_RATE=${DECISION_GATE_STATE_SAMPLE_RATE:-}
      - DECISION_GATE_STATE_SAMPLE_RATE_WAKE_TRIAGE=${DECISION_GATE_STATE_SAMPLE_RATE_WAKE_TRIAGE:-}
      - DECISION_GATE_STATE_SAMPLE_DISABLED=${DECISION_GATE_STATE_SAMPLE_DISABLED:-}
      - DECISION_GATE_TEMP_AUTOFIT_ENABLED=${DECISION_GATE_TEMP_AUTOFIT_ENABLED:-}
      - DECISION_GATE_TEMP_AUTOFIT_DISABLED=${DECISION_GATE_TEMP_AUTOFIT_DISABLED:-}
      - DECISION_GATE_ADMISSION_DISABLED=${DECISION_GATE_ADMISSION_DISABLED:-}
      # 2026-10-04: the act CONTROL SAMPLE — one confident park (wake_triage) / skip (sweep_triage, E12) in 10 fires
      # anyway, stamped control:true, so the act band gets labels the auto-demote can judge. The sweep pair was never
      # forwarded either (its kill switch could not reach a container) — both purposes' switches ride here now.
      - DECISION_GATE_WAKE_TRIAGE_CONTROL_RATE=${DECISION_GATE_WAKE_TRIAGE_CONTROL_RATE:-}
      - WAKE_TRIAGE_CONTROL_SAMPLE_DISABLED=${WAKE_TRIAGE_CONTROL_SAMPLE_DISABLED:-}
      - DECISION_GATE_SWEEP_TRIAGE_CONTROL_RATE=${DECISION_GATE_SWEEP_TRIAGE_CONTROL_RATE:-}
      - SWEEP_TRIAGE_CONTROL_SAMPLE_DISABLED=${SWEEP_TRIAGE_CONTROL_SAMPLE_DISABLED:-}
      - MCP_DIGBY_TOKEN=${MCP_DIGBY_TOKEN:-}
      # Per-session tailnet egress scoping pepper (ticket 4ed6eb2e). Never forwarded before 2026-10-13,
      # so scoping never ran in prod. Must be identical in backend + worker (deterministic per-session
      # SOCKS5 credentials). Empty = legacy (unscoped) layout, the pre-2026-10-13 behaviour.
      - CODING_EGRESS_SECRET=${CODING_EGRESS_SECRET:-}
      # Hosted hardened browser (ticket ea3ad8a8). Must match browser-service in
      # docker-compose.base.yml (same BROWSER_SERVICE_SECRET — per-session HMAC
      # tokens are derived from it on both sides). ENABLED off = the backend
      # never routes to the hosted browser (staged rollout, default off).
      - BROWSER_SERVICE_ENABLED=${BROWSER_SERVICE_ENABLED:-}
      - BROWSER_SERVICE_SECRET=${BROWSER_SERVICE_SECRET:-}
      - BROWSER_SERVICE_URL=${BROWSER_SERVICE_URL:-http://browser-service:3100}
      # Web-search gateway URL override (self-host runs its own brightdata-mcp,
      # or leaves this unset to keep the prod default). Empty = code default.
      - MCP_DIGBY_URL=${MCP_DIGBY_URL:-}
      # BROWSER-ONLY gateway pin (ticket 5f69fdc4 defect A, measured 2026-11-03).
      # The interactive cloud browser is the ONLY caller that must ride a STICKY
      # path: one Mcp-Session-Id owns one gateway stdio child (one browser), and
      # the invoice/gateway state lives INSIDE this box's mcp-gateway container.
      # mcp.digby.ai resolves to ALB digby-app-tg with BOTH boxes registered and
      # `stickiness.enabled=false`, so a session created on box A 404s on box B —
      # measured: one sid + 12 calls through the public URL = ok=6 / 404=6, the
      # same sid box-local = clean. The shared stateless /mcp keeps using the ALB
      # (session-less, so affinity is irrelevant there); ONLY this browser mount
      # is pinned to the gateway published on THIS host. `host.docker.internal`
      # is injected by the `extra_hosts` line below, so the value never depends
      # on the docker network's auto-assigned subnet.
      #
      # Declared as a PASSTHROUGH with an EMPTY default on purpose: the code
      # derives the browser mount from MCP_DIGBY_URL when this is unset, which is
      # exactly right for a self-host pointing at a remote gateway. Production
      # sets it in /opt/crossmodel/.env to the host-published gateway
      # (http://host.docker.internal:8200/browser/mcp) — a compose env list is
      # explicit ${VAR} interpolation, so an .env key alone never reaches the
      # container and that value MUST be declared here to be forwarded.
      - MCP_DIGBY_BROWSER_URL=${MCP_DIGBY_BROWSER_URL:-}
      # Interactive cloud browsing (ticket 5f69fdc4). Compose env lists are
      # EXPLICIT ${VAR} interpolation — a key added only to /opt/crossmodel/.env
      # NEVER reaches the container (docker-compose.app.yml itself:34-35). The
      # code default stays OFF, so shipping this is inert until an operator sets
      # CLOUD_BROWSER_CDP=1; do NOT set it before the stateful gateway + the
      # session-carrying client are live (measured: flipping it early turns a
      # working 199-byte page read into ok=true 0 bytes / 60s SSE timeouts).
      - CLOUD_BROWSER_CDP=${CLOUD_BROWSER_CDP:-}
      # Cookie Secure override — self-hosted plain-http LAN instances set
      # COOKIE_SECURE=false (see auth-cookie.ts). Empty = NODE_ENV default.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # BrightData DIRECT failover (2026-07-14): the backend calls
      # api.brightdata.com straight when the MCP gateway is degraded — web
      # search/scrape must survive any gateway failure mode.
      - BRIGHTDATA_API_TOKEN=${BRIGHTDATA_API_TOKEN:-}
      - BRIGHTDATA_WEB_UNLOCKER_ZONE=${BRIGHTDATA_WEB_UNLOCKER_ZONE:-web_unlocker1}
      # Google OAuth + Workspace MCP
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-https://digby.ai/api/crossmodel/google/callback}
      - GOOGLE_TOKEN_ENCRYPTION_KEY=${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      - GOOGLE_MCP_API_KEY=${GOOGLE_MCP_API_KEY:-}
      - GOOGLE_MCP_URL=${GOOGLE_MCP_URL:-http://google-mcp-prod:8000/mcp}
      # GitHub OAuth + MCP integration
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - GITHUB_TOKEN_ENCRYPTION_KEY=${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      - GITHUB_MCP_API_KEY=${GITHUB_MCP_API_KEY:-}
      - GITHUB_MCP_URL=${GITHUB_MCP_URL:-http://github-mcp-prod:8000/mcp}
      # X (Twitter) OAuth 2.0 PKCE + MCP integration
      - X_OAUTH_CLIENT_ID=${X_OAUTH_CLIENT_ID:-}
      - X_OAUTH_CLIENT_SECRET=${X_OAUTH_CLIENT_SECRET:-}
      - X_OAUTH_REDIRECT_URI=${X_OAUTH_REDIRECT_URI:-https://digby.ai/api/crossmodel/x/callback}
      - X_TOKEN_ENCRYPTION_KEY=${X_TOKEN_ENCRYPTION_KEY:-}
      - X_MCP_API_KEY=${X_MCP_API_KEY:-}
      - X_MCP_URL=${X_MCP_URL:-http://x-mcp-prod:8000/mcp}
      - X_BEARER_TOKEN=${X_BEARER_TOKEN:-}
      # Xero OAuth + Accounting integration
      - XERO_CLIENT_ID=${XERO_CLIENT_ID:-}
      - XERO_CLIENT_SECRET=${XERO_CLIENT_SECRET:-}
      - XERO_OAUTH_REDIRECT_URI=${XERO_OAUTH_REDIRECT_URI:-https://digby.ai/api/crossmodel/xero/callback}
      # Plaid banking integration
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-production}
      # Slack OAuth + Workspace MCP integration
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_OAUTH_REDIRECT_URI=${SLACK_OAUTH_REDIRECT_URI:-https://digby.ai/api/crossmodel/slack/callback}
      - SLACK_TOKEN_ENCRYPTION_KEY=${SLACK_TOKEN_ENCRYPTION_KEY:-}
      - SLACK_MCP_API_KEY=${SLACK_MCP_API_KEY:-}
      - SLACK_MCP_URL=${SLACK_MCP_URL:-http://slack-mcp-prod:8000/mcp}
      # Discord MCP — shared bot (bot token lives only in the discord-mcp container)
      - DISCORD_MCP_API_KEY=${DISCORD_MCP_API_KEY:-}
      - DISCORD_MCP_URL=${DISCORD_MCP_URL:-http://discord-mcp-prod:8000/mcp}
      # Asana OAuth + Tasks MCP integration
      - ASANA_CLIENT_ID=${ASANA_CLIENT_ID:-}
      - ASANA_CLIENT_SECRET=${ASANA_CLIENT_SECRET:-}
      - ASANA_OAUTH_REDIRECT_URI=${ASANA_OAUTH_REDIRECT_URI:-https://digby.ai/api/crossmodel/asana/callback}
      - ASANA_TOKEN_ENCRYPTION_KEY=${ASANA_TOKEN_ENCRYPTION_KEY:-}
      - ASANA_MCP_API_KEY=${ASANA_MCP_API_KEY:-}
      - ASANA_MCP_URL=${ASANA_MCP_URL:-http://asana-mcp-prod:8000/mcp}
      # Telegram bot integration (single shared "Digby" bot; webhook on the backend)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # Email as Digby (ticket 54f237bf) — send_email_as_digby SMTP (all optional; unset = not configured)
      - DIGBY_SMTP_HOST=${DIGBY_SMTP_HOST:-smtp.gmail.com}
      - DIGBY_SMTP_PORT=${DIGBY_SMTP_PORT:-587}
      - DIGBY_SMTP_USER=${DIGBY_SMTP_USER:-}
      - DIGBY_SMTP_PASS=${DIGBY_SMTP_PASS:-}
      - DIGBY_SMTP_FROM=${DIGBY_SMTP_FROM:-digby@digby.ai}
      # Memory: cap Node.js heap to prevent OOM. Container limit is 3GB.
      - NODE_OPTIONS=--max-old-space-size=2560
      # Digby Code — agentic coding worktrees (shared volume so they survive
      # blue-green deploys; both colors mount the same named volume).
      - CODING_WORKSPACE_ROOT=/app/coding-workspaces
      # Per-session Docker containers for isolated code execution. The backend
      # talks to the daemon ONLY through the filtered docker-socket-proxy (it
      # never sees the raw host socket). Falls back to in-process execution if
      # the proxy is unreachable, so this is safe to leave on.
      - CODING_CONTAINER_MODE=1
      - CODING_WORKSPACE_VOLUME=crossmodel_coding_workspaces
      # Session env-seed sidecars ($DIGBY_ENV backups) live on their OWN volume,
      # mounted only into backend/worker — never into session containers (2026-08-20 review).
      - CODING_ENV_ROOT=/app/coding-session-env
      # Feedback-ticket screenshots (e87aee19) live on their OWN named volume —
      # the container layer is ephemeral (blue-green rebuilds) and the workspace
      # volume is session-mountable, so neither may hold them (review B1).
      - FEEDBACK_IMAGES_ROOT=/app/feedback-images
      # Machine-close replay-test verification (closure-evidence.ts): the
      # rsync-deployed repo on the box is bind-mounted READ-ONLY at /repo so
      # a repo-root-relative replayTestPath (e.g. backend/src/x.test.ts)
      # resolves — the container's own tree is only the backend dir.
      - REPLAY_TEST_ROOT=/repo
      - DOCKER_HOST=${DOCKER_HOST:-tcp://admin-docker-proxy-prod:2375}
      # Infra watch (owner 2026-09-18): the box's stable label for box_health
      # rows / [INFRA ALERT] wakes — set per box in /opt/crossmodel-local/env-overrides.env
      # (box-a / box-b / box-c); empty → the reporter falls back to the container hostname.
      - BOX_NAME=${BOX_NAME:-}
      # The commit this container was deployed from (deploy.yml writes
      # .deploy-sha; deploy-blue-green.sh / deploy-coding-worker.sh export it)
      # — box_health rows and get_fleet_telemetry's deploy view report it so the
      # Fleet Supervisor can verify "every box runs main head" itself.
      - DEPLOY_SHA=${DEPLOY_SHA:-}
    volumes:
      - coding_workspaces:/app/coding-workspaces
      - coding_session_env:/app/coding-session-env
      - feedback_images:/app/feedback-images
      - /opt/crossmodel:/repo:ro
      # Infra watch (2026-09-18): the nightly pg_dump dir, read-only, so the
      # backend's box_health row carries the newest dump's age (box A owns the
      # dumps; on other boxes docker creates an empty dir — reported as count 0
      # and ignored by the fleet-level backup-age rule).
      - /opt/crossmodel-backups:/backups:ro
    # Makes host.docker.internal resolve to THIS box's docker bridge gateway, so
    # MCP_DIGBY_BROWSER_URL can name the gateway published on this host (port
    # 8200) without hard-coding an auto-assigned subnet. Ticket 5f69fdc4 defect A:
    # the browser mount must be pinned to THIS box, because an Mcp-Session-Id owns
    # a stdio child inside this box's gateway and the ALB round-robins mcp.digby.ai
    # across both boxes with stickiness disabled.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - crossmodel_admin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      # 2026-08-07: a backend that booted in 77s on a build-loaded box was
      # declared unhealthy at ~74s — 3s before "Server running". Widened so a
      # slow boot fails at ~150s instead of racing the gate.
      # 2026-08-14: under repeated-deploy load (live stack + failed stacks left
      # running + image unpack) the backend boot took >150s — 3 consecutive
      # deploys failed the gate. Widened to unhealthy at ~210s.
      # 2026-08-31 (ticket e1479b24): the loaded-box backend boot reached 201s
      # (deploy 33376975655 passed at 201s, 9s under the unhealthy point) then
      # >204s (deploy 33379305472 FAILED the gate mid-boot — the 2026-08-14
      # budget had been racing the boot all along). start_period 240s →
      # unhealthy at ~330s (240 + 9×10): above slow-normal boot with ~90s of
      # failure tolerance, still under the deploy script's 420s HEALTH_TIMEOUT
      # (raised 240s→420s on 2026-08-31, ticket dcf9056a) so a genuinely-broken
      # backend fails fast instead of timing the gate out.
      # 2026-09-01 (ticket ccaab266): the loaded first host's slow-normal boot
      # crept to ~326s — deploy 33496944537 PASSED at 321s (9s margin), then
      # 33505472300 + 33511018130 both FAILED at 326s mid-boot, the same race
      # as 08-31 (box-load indicator: the migrations step's prisma config load
      # ran ~284-306s on every deploy that day). PR #582 took start_period
      # 240s→300s (unhealthy ~390s, ~64s headroom over today's boots); with
      # boot creep of +122s in 24h (204s 08-31 → 326s 09-01) that margin would
      # race again within ~12h, so PR #581 widens further: start_period 420s →
      # unhealthy at ~510s (420 + 9×10): ~180s headroom, still under the deploy
      # script's 560s HEALTH_TIMEOUT (raised 420s→560s in the same PR) so a
      # genuinely-broken backend fails fast instead of timing the gate out.
      retries: 9
      start_period: 420s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        - BACKEND_CHOWN_RECURSIVE=${BACKEND_CHOWN_RECURSIVE:-0}
    # deploy_speedups #5 (2026-09-26): the worker is the backend image with a
    # different command, so it shares the backend's tag (like relay) —
    # deploy-blue-green.sh builds `backend frontend` and `up` starts the worker
    # from the already-built tag; bake no longer exports a second ~100 s image
    # and box B (ENABLE_WORKER=false) no longer builds a worker at all. The
    # build stanza stays so WORKER_IMAGE_SHARED_DISABLED=1 (full-service build)
    # and box C's `compose build worker` keep working. APP_IMAGE overrides the
    # tag: deploy-coding-worker.sh sets it to the per-wave
    # crossmodel_<color>_<epoch>-worker name its drainer parking/pruning expects
    # (nested default = documented compose interpolation).
    image: ${APP_IMAGE:-digby-app-${BG_COLOR}}
    container_name: admin-worker-${BG_COLOR}
    command: ["node", "dist/worker.js"]
    # NO ports: the worker only claims agent_runs rows from Postgres + Redis.
    # Same environment as backend (verbatim) — it executes the same coding runs.
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Open-source STT (Parakeet) — same as backend: youtube_pipe fallback
      # inside worker-executed agent runs uses it too.
      - STT_BASE_URL=${STT_BASE_URL:-http://admin-stt-prod:5092/v1}
      - STT_API_KEY=${STT_API_KEY:-}
