      # unlisted until their parsers treat a blank value as unset.
      - COMPUTE_POLICY_DISABLED=${COMPUTE_POLICY_DISABLED:-}
      - COMPUTE_POLICY_MACHINE_DISABLED=${COMPUTE_POLICY_MACHINE_DISABLED:-}
