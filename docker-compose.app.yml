# This file is parameterized via environment variables:
#   BG_COLOR=blue BG_PORT_BACKEND=4001 BG_PORT_FRONTEND=8248 docker compose -p crossmodel_blue -f docker-compose.app.yml up -d
#   BG_COLOR=green BG_PORT_BACKEND=4002 BG_PORT_FRONTEND=8249 docker compose -p crossmodel_green -f docker-compose.app.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        # deploy_speedups #2 (2026-09-26): 1 restores `chown -R nodejs:nodejs /app`
        # in backend/Dockerfile (default: COPY --chown + non-recursive chown).
        - BACKEND_CHOWN_RECURSIVE=${BACKEND_CHOWN_RECURSIVE:-0}
    # Explicit tag so the relay AND worker services reuse THIS image (no
    # second build/export — deploy_speedups #5, 2026-09-26).
    image: digby-app-${BG_COLOR}
    container_name: admin-backend-${BG_COLOR}
    ports:
      - "127.0.0.1:${BG_PORT_BACKEND}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Open-source STT (Parakeet, docker-compose.base.yml `stt` service) —
      # chat voice notes + youtube_pipe audio fallback. DashScope qwen3-asr-flash is the
      # automatic fallback when the service is unreachable.
      - STT_BASE_URL=${STT_BASE_URL:-http://admin-stt-prod:5092/v1}
      - STT_API_KEY=${STT_API_KEY:-}
      - STT_MODEL=${STT_MODEL:-whisper-1}
      - YTDLP_PATH=${YTDLP_PATH:-yt-dlp}
      # Live ticket lane (PR #296/#299): user-filed feedback tickets dispatch
      # structured briefs into the admin platform-engineer session. DARK unless
      # TICKET_DISPATCH_ENABLED=true lands via the box-local env-override
      # channel (ec2-ops env_override input → deploy.yml applies → recreate).
      # NOTE: compose env lists are explicit ${VAR} interpolation — a new key in
      # .env alone never reaches the container; it must be listed here.
      - TICKET_DISPATCH_ENABLED=${TICKET_DISPATCH_ENABLED:-}
      - PLATFORM_ENGINEER_CHAT_ID=${PLATFORM_ENGINEER_CHAT_ID:-}
      - TICKET_DISPATCH_DAILY_CAP=${TICKET_DISPATCH_DAILY_CAP:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:SecureP%40ssw0rd2026%21@postgres:5432/admin_db?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production-minimum-32-characters}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-this-in-production-minimum-32-characters}
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_EXPIRES_IN=7d
      - FRONTEND_URL=https://digby.ai,http://100.64.0.1:8247,http://example-local-host:8247,http://localhost:8247,http://example-local.test
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - XAI_GROK_API_KEY=${XAI_GROK_API_KEY:-}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      # Open Source model providers (all direct APIs — Fireworks removed)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      # Decision-gate seat (2026-09-24 seat #19; plumbing 2026-09-25 — the key
      # never reached the containers): TypeSafe Jev built-in.
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - TYPESAFE_BASE_URL=${TYPESAFE_BASE_URL:-}
      - TYPESAFE_MODEL=${TYPESAFE_MODEL:-}
      # Meta Conversions API (2026-10-07, backend/src/modules/auth/meta-capi.ts): CompleteRegistration on sign-up.
      # Inert while the token is unset; META_CAPI_DISABLED=1 kills it; META_GRAPH_API_VERSION overrides v24.0.
      - META_CAPI_ACCESS_TOKEN=${META_CAPI_ACCESS_TOKEN:-}
      - META_CAPI_DISABLED=${META_CAPI_DISABLED:-}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-}
      # Supervisor side panels (2026-10-08, crossmodel/platform/usage-rollup.ts): =1 → /projects/:id/usage + /fleet/usage 404.
      - SUPERVISOR_USAGE_DISABLED=${SUPERVISOR_USAGE_DISABLED:-}
      # Patience plan 1a / N4 (2026-09-25): kill switches + knobs must be LISTED here or they never reach the container.
      - PATIENCE_AUTO_ONLY=${PATIENCE_AUTO_ONLY:-}
      - QUOTA_TRUSTED_PROXY_HOPS=${QUOTA_TRUSTED_PROXY_HOPS:-}
      - LABEL_WINDOW_SAMPLE_PERCENT=${LABEL_WINDOW_SAMPLE_PERCENT:-}
      - LABEL_WINDOW_DECISION_SPEC=${LABEL_WINDOW_DECISION_SPEC:-}
