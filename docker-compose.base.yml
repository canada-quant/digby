name: crossmodel

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: admin-postgres-prod
    ports:
      - "9384:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-local-dev}
      - POSTGRES_DB=admin_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      admin-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: admin-redis-prod
    ports:
      - "7856:6379"
    volumes:
      - redis_data:/data
    networks:
      admin-network:
        aliases:
          - redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320m

  adminer:
    image: adminer:latest
    container_name: admin-adminer-prod
    ports:
      - "9521:8080"
    depends_on:
      - postgres
    networks:
      - admin-network
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # Self-hosted open-source STT (speech-to-text): NVIDIA Parakeet-TDT-0.6B-v3
  # (CC-BY-4.0) served over an OpenAI-compatible /v1/audio/transcriptions API
  # (achetronic/parakeet — Go + ONNX Runtime, CPU-only, INT8 model baked into
  # the image; ~30x realtime on 4 cores). Powers chat voice-note transcription
  # AND the youtube_pipe audio fallback — the backend reaches it at
  # STT_BASE_URL=http://admin-stt-prod:5092/v1 (DashScope qwen3-asr-flash is the
  # automatic fallback when this service is down). Published on localhost only
  # for ops curl-ability; app traffic stays on the internal network.
  stt:
    image: ghcr.io/achetronic/parakeet:latest
    container_name: admin-stt-prod
    ports:
      - "127.0.0.1:5092:5092"
    networks:
      admin-network:
        aliases:
          - stt
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  # Digby Code — Docker socket proxy. ONLY this container touches the host
  # docker socket (read-only). It exposes a filtered Docker API over TCP to the
  # backend (DOCKER_HOST=tcp://docker-socket-proxy:2375) with just the endpoints
  # per-session runner containers need — so the backend never gets the raw
  # host-root socket. Not published to the host; internal network only.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: admin-docker-proxy-prod
    # (History: 2026-07-29 → 2026-09-24 this was published on the host so a
    # peer web box could drive this box's daemon over DOCKER_HOST — see the
    # security note below for why that is gone.)
    # NO host port (owner security fix 2026-09-24). The proxy is reachable ONLY
    # on the compose network (tcp://admin-docker-proxy-prod:2375) by same-box
    # containers — exactly how box C has run since the split. Publishing
    # "2375:2375" on the web boxes let ANY peer in the security group — which
    # includes the NATed traffic of every coding sandbox on box C — reach an
    # unauthenticated Docker API with CONTAINERS+EXEC+POST: root on A and B for
    # model-written code (probed live from the shared dev container: A and B
    # answered `OK`). Web boxes never had working docker access to C anyway
    # (C's proxy was never published); coding-plane reads ride Redis
    # request/reply from C's worker. The SG rule "app-sg peer A-B port 2375"
    # was revoked the same day. Never re-add a host port here.
    environment:
      # Allowed API surface (1=allow). Everything else defaults to denied.
      - CONTAINERS=1   # create/inspect/list/remove session containers
      - EXEC=1         # docker exec (run shell tools in the container)
      - IMAGES=1       # pull the runner image on first use
      - INFO=1         # daemon reachability probe
      - POST=1         # permit write methods for the above
      # Explicitly deny the dangerous surfaces.
      - NETWORKS=0
      - VOLUMES=0
      - SWARM=0
      - SYSTEM=0
      - SECRETS=0
      - CONFIGS=0
      - PLUGINS=0
      - NODES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - admin-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m

  google-mcp:
    build:
      context: ./google-mcp
      dockerfile: Dockerfile
    container_name: google-mcp-prod
    ports:
      - "8201:8000"
    environment:
      - GOOGLE_MCP_API_KEY=${GOOGLE_MCP_API_KEY:-}
      # Kill switch for the rotated-attachmentId fallback (tickets 9a818013/a7f6c4e4,
      # 2026-10-01): GMAIL_STALE_ATTACHMENT_ID_FALLBACK_DISABLED=1 restores exact-match-only.
      - GMAIL_STALE_ATTACHMENT_ID_FALLBACK_DISABLED=${GMAIL_STALE_ATTACHMENT_ID_FALLBACK_DISABLED:-}
      - NODE_OPTIONS=--max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - admin-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  github-mcp:
    build:
      context: ./github-mcp
      dockerfile: Dockerfile
    container_name: github-mcp-prod
    ports:
      - "8202:8000"
    environment:
      - GITHUB_MCP_API_KEY=${GITHUB_MCP_API_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - admin-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  x-mcp:
    build:
      context: ./x-mcp
      dockerfile: Dockerfile
    container_name: x-mcp-prod
    ports:
      - "8203:8000"
    environment:
      - X_MCP_API_KEY=${X_MCP_API_KEY:-}
      - MCP_DIGBY_TOKEN=${MCP_DIGBY_TOKEN:-}
      - BRIGHTDATA_MCP_URL=${BRIGHTDATA_MCP_URL:-https://mcp.digby.ai/mcp}
      - NODE_OPTIONS=--max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - admin-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  slack-mcp:
    build:
      context: ./slack-mcp
      dockerfile: Dockerfile
    container_name: slack-mcp-prod
    ports:
      - "8204:8000"
    environment:
      - SLACK_MCP_API_KEY=${SLACK_MCP_API_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - admin-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  # Discord MCP — read/send Discord messages via the shared bot (2026-10-05).
  # AUTH IS THE SHARED BOT TOKEN (Discord has no per-user OAuth here): the
  # backend calls with the shared DISCORD_MCP_API_KEY, the bot token lives
  # ONLY in this container. Mirrors slack-mcp/x-mcp.
  discord-mcp:
    build:
      context: ./discord-mcp
      dockerfile: Dockerfile
    container_name: discord-mcp-prod
    ports:
      - "8207:8000"
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_MCP_API_KEY=${DISCORD_MCP_API_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - admin-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  asana-mcp:
    build:
      context: ./asana-mcp
      dockerfile: Dockerfile
    container_name: asana-mcp-prod
    ports:
      - "8205:8000"
    environment:
      - ASANA_MCP_API_KEY=${ASANA_MCP_API_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - admin-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  # Digby platform MCP (P6) — the platform REST API as MCP tools.
  # AUTH IS PER-USER PASS-THROUGH: clients send their own Digby JWT or agent
  # token (dgt_…) in the Authorization header and it is forwarded verbatim to
  # the backend. There is deliberately NO shared MCP_API_KEY here — see
  # docs/DIGBY_MCP.md (confused-deputy note).
  digby-mcp:
    build:
      context: ./digby-mcp
      dockerfile: Dockerfile
    container_name: digby-mcp-prod
    ports:
      - "8206:8000"
    environment:
      # Backend base URL. Blue-green: default = the public URL — the ALB + host
      # nginx always route to the LIVE color. Do NOT default to a color-pinned
      # container name (admin-backend-blue/green): this is a base service
      # started before the color is known, and a pinned name leaves the MCP
      # broken whenever the other color is live (the losing color's containers
      # are stopped/removed after each flip). Hairpin latency is negligible;
      # when the ALB path is down the platform API is down for everyone anyway.
      # Override with DIGBY_API_URL if ever needed.
      - DIGBY_API_URL=${DIGBY_API_URL:-https://digby.ai}
      - NODE_OPTIONS=--max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - admin-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

  brightdata-mcp:
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile
    container_name: mcp-gateway-prod
    ports:
      - "8200:8000"
    environment:
      - BRIGHTDATA_API_TOKEN=${BRIGHTDATA_API_TOKEN:-}
      - BRIGHTDATA_WEB_UNLOCKER_ZONE=${BRIGHTDATA_WEB_UNLOCKER_ZONE:-web_unlocker1}
      - BRIGHTDATA_BROWSER_ZONE=${BRIGHTDATA_BROWSER_ZONE:-scraping_browser1}
      - MCP_API_KEY=${MCP_DIGBY_TOKEN:-}
      - NODE_OPTIONS=--max-old-space-size=768
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://127.0.0.1:8000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 2026-07-13: 1g → 2g. The memcg OOM-killer was SIGKILLing the
          # @brightdata/mcp child ~every 4 min (23 kills in 90 min; container
          # pinned at 987MiB/1GiB) — each kill caused a 10-20s window where every
          # search returned an empty SSE body. Host (t3.large, 8GB) has headroom.
          memory: 2g

  # Hosted hardened browser (ticket ea3ad8a8): ONE pinned Chromium, per-session
  # Playwright CONTEXTS (own cookies/localStorage, persisted to a named volume
  # — the "saved cache / VM-style" behavior). Sits on admin-network like the
  # other base services; the BACKEND reaches it at http://browser-service:3100
  # (BROWSER_SERVICE_URL) with a per-session HMAC bearer token derived from
  # BROWSER_SERVICE_SECRET (shared env with the backend; unset = INERT mode:
  # the service stays health-green but NO token can ever verify — tokenFor
  # returns '' and verifyToken rejects it — so every action 401s and no
  # context can be created; never crash-loops a deploy wave). NOT published to
  # the host: the frontend never talks to it, only the backend/worker do.
  # Rollout is staged — the backend also requires BROWSER_SERVICE_ENABLED or
  # it never routes to it.
  browser-service:
    build:
      context: ./browser-service
      dockerfile: Dockerfile
    container_name: digby-browser-service
    environment:
      - BROWSER_SERVICE_SECRET=${BROWSER_SERVICE_SECRET:-}
      - BROWSER_SERVICE_PORT=3100
      - BROWSER_SERVICE_DATA_DIR=/data/contexts
      - BROWSER_CONTEXTS_MAX=${BROWSER_CONTEXTS_MAX:-16}
      - BROWSER_CONTEXT_IDLE_MS=${BROWSER_CONTEXT_IDLE_MS:-900000}
    volumes:
      - browser_contexts:/data/contexts
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://127.0.0.1:3100/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - admin-network
    restart: unless-stopped
    # Zombie reaping (review B2): the playwright base image ships no tini, so
    # Docker's built-in docker-init reaps the Chromium trees instead.
    init: true
    deploy:
      resources:
        limits:
          # One Chromium + up to BROWSER_CONTEXTS_MAX contexts. Chromium's
          # baseline ~350-500MB; contexts add ~50-150MB each at the default
          # cap of 16 → 2g ceiling with LRU eviction before pressure.
          memory: 2g

volumes:
  postgres_data:
  redis_data:
  browser_contexts:

networks:
  admin-network:
    driver: bridge