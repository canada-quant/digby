#cloud-config
# user-data-app-b.yaml — first-boot guardrails for example-ca-app-b, the SECOND
# (stateless) app instance, in ca-central-1b. Instance B runs the SAME golden
# AMI as prod, so without these guardrails its first boot would start a second
# postgres/redis (split-brain data), a second worker (double-fired schedules,
# claimed agent_runs), adminer, and the nightly backup timer.
#
# B is a STATELESS app client of instance A (__A_PRIVATE_IP__ is templated to
# A's VPC-private IP by 50-launch-app-b.sh):
#   * Postgres → A:9384   (VPC-private, SG-gated to the app security group)
#   * Redis    → A:7856   (queues/sessions shared — B-local redis would strand
#                          BullMQ jobs the worker on A must consume)
#   * Docker   → A:2375   (A's filtered docker-socket-proxy: coding-session
#                          containers + workspaces ALWAYS live on A, so the
#                          worker on A can resume them and B stays disposable)
#
# It also stages /opt/crossmodel-local/{deploy-flags.env,env-overrides.env}
# (OUTSIDE the deploy rsync root, so every FUTURE deploy keeps B pointed at A):
#   * deploy-flags.env   → ENABLE_STATEFUL/MIGRATIONS/WORKER=false, sourced by
#                          deploy-blue-green.sh (stateless base fleet only, no
#                          prisma migrate, no worker start/health-gate);
#   * env-overrides.env  → DATABASE_URL/REDIS_URL/DOCKER_HOST → A, merged into
#                          /opt/crossmodel/.env by deploy.yml's existing
#                          box-local-override step (compose picks them up via
#                          the ${VAR:-default} substitutions).
#
# Finally it rewrites the AMI-baked compose aliases → A's IPs and recreates the
# blue backend/frontend so B is healthy IMMEDIATELY on first boot, before any
# deploy has rsynced the new repo compose files. Prod impact: NONE (B joins
# the target group only after its health check passes).
write_files:
  - path: /usr/local/bin/digby-app-b-guard.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      # Neuter stateful + worker containers on instance B by flipping their
      # docker restart policy to "no" (edit while dockerd is stopped so it
      # sticks). B must NEVER boot its own postgres/redis/worker/adminer.
      import json, glob, os
      NEUTER = ("admin-worker-", "admin-adminer-prod", "admin-postgres-prod", "admin-redis-prod")
      changed = []
      for cfg in glob.glob("/var/lib/docker/containers/*/config.v2.json"):
          try:
              with open(cfg) as f:
                  c = json.load(f)
          except Exception:
              continue
          name = (c.get("Name") or "").lstrip("/")
          if not any(name.startswith(p) for p in NEUTER):
              continue
          hc = os.path.join(os.path.dirname(cfg), "hostconfig.json")
          try:
              with open(hc) as f:
                  h = json.load(f)
          except Exception:
              continue
          rp = h.setdefault("RestartPolicy", {})
          if rp.get("Name") != "no":
              rp["Name"] = "no"
              rp["MaximumRetryCount"] = 0
              with open(hc, "w") as f:
                  json.dump(h, f)
              changed.append(name)
      print("neutered restart policy for:", changed or "none")

  - path: /usr/local/bin/digby-app-b-guard.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      exec >>/var/log/digby-app-b-guard.log 2>&1
      set -x
      A_IP="__A_PRIVATE_IP__"
      # 1. Daemon fully down so hostconfig edits persist.
      systemctl stop docker docker.socket containerd || true
      # 2. restart=no for worker + adminer + LOCAL postgres/redis.
      python3 /usr/local/bin/digby-app-b-guard.py
      # 3. No nightly pg_dump → S3 from B (A owns backups). NOTE: `systemctl
      #    mask` FAILS here — the units are real files in /etc/systemd/system
      #    (installed by the AMI's first boot), and mask must symlink the path
      #    to /dev/null. stop+disable survives reboots (the installer is
      #    first-boot-only cloud-init, it never re-enables).
      systemctl stop digby-backup.timer digby-backup.service 2>/dev/null || true
      systemctl disable digby-backup.timer 2>/dev/null || true
      # 4. Bring docker up (neutered containers stay down).
      systemctl start docker

      # 5. Box-local deploy flags + env overrides (survive deploy rsyncs —
      #    /opt/crossmodel-local is outside the rsync root).
      mkdir -p /opt/crossmodel-local
      cat > /opt/crossmodel-local/deploy-flags.env <<'FLAGS'
      ENABLE_STATEFUL=false
      ENABLE_MIGRATIONS=false
      ENABLE_WORKER=false
      FLAGS
      cat > /opt/crossmodel-local/env-overrides.env <<EOF
      # 2026-09-14 (issue #131): the old static default was removed — the DB
      # credential now lives in SSM (/example/ca/rds/app-password) and is staged
      # by scripts/deploy/sync-db-secret.sh. This file is a historical
      # migration snapshot; see docs/DB_SECRET_ROTATION.md for the live path.
      DATABASE_URL=postgresql://admin:REPLACE_FROM_SSM@${A_IP}:9384/admin_db
      REDIS_URL=redis://${A_IP}:7856
      DOCKER_HOST=tcp://${A_IP}:2375
      EOF
      chmod 600 /opt/crossmodel-local/*.env
      # The deploy workflow SSHes in as UBUNTU — root-owned 600 files would be
      # unreadable to both the workflow's env-override merge and the
      # deploy-blue-green.sh flags source (this bit the first fleet deploy).
      chown ubuntu:ubuntu /opt/crossmodel-local/*.env

      # 6. Point the CURRENT (AMI-baked) containers at A: rewrite the compose
      #    aliases in the box's copy. (The first real deploy rsyncs the repo
      #    versions with ${VAR:-default} substitution + applies the overrides
      #    file above, landing on the same end state.)
      cd /opt/crossmodel
      sed -i \
        -e "s|@postgres:5432|@${A_IP}:9384|g" \
        -e "s|redis://redis:6379|redis://${A_IP}:7856|g" \
        -e "s|tcp://admin-docker-proxy-prod:2375|tcp://${A_IP}:2375|g" \
        docker-compose.app.yml docker-compose.prod.yml || true

      # 7. Wait until A's postgres is reachable (VPC + SG), then recreate the
      #    blue backend/frontend with the corrected env.
      for i in $(seq 1 60); do
        timeout 3 bash -c "echo > /dev/tcp/${A_IP}/9384" && break
        sleep 5
      done
      BG_COLOR=blue BG_PORT_BACKEND=4001 BG_PORT_FRONTEND=8248 \
        docker compose -p crossmodel_blue -f docker-compose.app.yml up -d backend frontend

      # 8. Wait for the backend to report healthy against A's DB.
      for i in $(seq 1 60); do
        st=$(docker inspect --format '{{.State.Health.Status}}' admin-backend-blue 2>/dev/null || echo missing)
        [ "$st" = "healthy" ] && break
        sleep 5
      done
      docker inspect --format 'backend health: {{.State.Health.Status}}' admin-backend-blue || true
      touch /var/lib/digby-app-b-guard.done
      echo "app-b guard complete $(date -Is)"

runcmd:
  - [bash, /usr/local/bin/digby-app-b-guard.sh]
