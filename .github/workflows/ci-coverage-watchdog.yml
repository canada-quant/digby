name: CI Coverage Watchdog

# fb707538 (2026-10-06): commits landed on main through the Contents/PR REST
# dispatch path (single-parent squash "merge: K…" lands, direct base-branch
# PUTs) create NO refs/heads push event — GitHub's `push: branches: [main]`
# CI trigger never fires for them, so those heads carry ZERO check-runs and
# zero workflow runs (13 of the 25 newest main commits at diagnosis time,
# including the code wave whose broken roster test failed two deploy runs —
# the DEPLOY was the first CI-equivalent run on that code). This sweep is the
# backstop: when main HEAD has zero check-runs, zero statuses and zero
# workflow runs at its sha while ci.yml exists on the ref, it dispatches CI
# on main (ci.yml gained workflow_dispatch for exactly this call). The
# durable fix for the REST path itself is the merge gate refusing `no_ci`
# when the repo has workflows (self-merge.service.ts, same ticket). All
# decisions + guard rails live in
# scripts/deploy/ci-coverage-watchdog.sh (tested by
# scripts/deploy/ci-coverage-watchdog.test.sh in the CI shell-script gate).

on:
  schedule:
    # Offset from the deploy-watchdog grids (7-59/15, 3-59/15) so the sweeps
    # never start in the same minute.
    - cron: '11-59/15 * * * *'
    # Second interleaved grid (adversarial review 0bdc8200, 2026-10-07):
    # GitHub scheduled runs are best-effort — deploy-watchdog's own single
    # grid showed a ~3h silent gap the same day (20:08Z→23:12Z) and carries a
    # second grid for exactly this reason. Each grid's drops are independent,
    # so two offset grids halve the worst-case silent window. Sweeps are
    # idempotent + fail-safe and the concurrency group serializes, so a
    # double-fire costs nothing.
    - cron: '19-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # The dispatch POST needs this — the default GITHUB_TOKEN here is read-only
  # (deploy-watchdog.yml's comment; workflow_dispatch via GITHUB_TOKEN is the
  # documented exception to the no-recursive-triggers rule).
  actions: write
  # The sweep reads the head's combined STATUSES
  # (GET /repos/{o}/{r}/commits/{sha}/status — the repo-wide check-run count
  # is deliberately NOT read, see the script header). Adversarial review
  # 0bdc8200: an undeclared permission on a fine-grained token is a silent
  # 403 → fail-safe abort → the watchdog never rescues anything.
  statuses: read

# One sweep at a time; a slow sweep should queue the next, never overlap.
concurrency:
  group: ci-coverage-watchdog
  cancel-in-progress: false

jobs:
  sweep:
    name: Dispatch CI on uncovered main heads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code (watchdog script)
        uses: actions/checkout@v4

      - name: Sweep — dispatch CI when main HEAD has zero check-runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash scripts/deploy/ci-coverage-watchdog.sh
